# ============================================================
# 智途AI 一键部署编排（MySQL + 后端 + 前端）
#
# 启动：docker compose up -d --build
# 访问：http://localhost:3000
# 演示账号：13800000000 / 123456      管理账号：13900000000 / 123456
#
# 想接真实大模型，先准备一个 .env 文件（可参考 .env.example）：
#   AI_API_KEY=sk-xxxxxxxx
# 不配置也能跑，系统会进入「离线模板模式」并在界面明确标注。
#
# 注意：MySQL 默认映射到宿主 3307 端口，避免与本机已装的 MySQL 冲突；
#       需要改端口就设置 DB_EXPOSE_PORT。
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: zhitu-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-zhitu_ai}
      TZ: Asia/Shanghai
    ports:
      - "${DB_EXPOSE_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # docker-entrypoint-initdb.d 内的脚本按「文件名」排序执行，
      # 所以用数字前缀锁定顺序：建表 → 专业字典 → 业务数据
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/majors.sql:/docker-entrypoint-initdb.d/02-majors.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/03-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    container_name: zhitu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-zhitu_ai}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_TIMEOUT: ${AI_TIMEOUT:-60000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      JWT_SECRET: ${JWT_SECRET:-zhitu-ai-please-change-this-secret-in-production}
      SQL_LOG_IMPL: org.apache.ibatis.logging.nologging.NoLoggingImpl
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_EXPOSE_PORT:-8080}:8080"

  frontend:
    build: ./frontend
    container_name: zhitu-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  mysql-data:
