server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 history 路由模式（createWebHistory），
    # 直接访问 /home/admin 这类深层路径时，服务器上并不存在对应文件，
    # 必须回退到 index.html 交给前端路由处理，否则刷新页面就会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把接口请求转发给后端容器（服务名 backend 由 compose 提供 DNS 解析）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # AI 对话是流式返回（NDJSON 逐行推送）：
        # 必须关闭 nginx 缓冲，否则内容会被攒够一整块才吐给浏览器，
        # 打字机效果就没了
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # 静态资源缓存策略：文件名带 hash，可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
